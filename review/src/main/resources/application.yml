spring:
  application:
    name: review-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:dbUser}:${MYSQL_PORT:3306}/${REVIEW_DB_NAME:review_db}
    username: ${REVIEW_DB_USER:review_user}
    password: ${REVIEW_DB_PASSWORD:review_pass123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

server:
  port: ${SERVER_PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:review-service}
